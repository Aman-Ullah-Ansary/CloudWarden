name: CloudWarden CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest
          pip install flake8
          pip install bandit

      - name: Check Python Version
        run: python --version

      - name: Check Pip
        run: pip --version

      - name: Run Unit Tests
        run: |
          pytest || true

      - name: Lint Code
        run: |
          flake8 . --max-line-length=120 || true

      - name: Security Scan
        run: |
          bandit -r . || true

      - name: Verify Project Files
        run: |
          ls
          pwd
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/cloudwarden-ai:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/cloudwarden-ai:${{ github.sha }} .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudwarden-ai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudwarden-ai:${{ github.sha }}
          
      - name: CI Completed
        run: echo "CloudWarden CI Passed"