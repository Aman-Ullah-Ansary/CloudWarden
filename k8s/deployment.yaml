apiVersion: apps/v1
kind: Deployment

metadata:
  name: payments-api
  namespace: payments

spec:
  replicas: 3

  selector:
    matchLabels:
      app: payments-api

  template:
    metadata:
      labels:
        app: payments-api

    spec:
      containers:
      - name: payments-api
        image: nginx:latest

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"

          limits:
            cpu: "1000m"
            memory: "512Mi"