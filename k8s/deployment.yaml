apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudwarden

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloudwarden

  template:
    metadata:
      labels:
        app: cloudwarden

    spec:
      containers:
        - name: cloudwarden
          image: amanansary0215/cloudwarden-ai:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8501

          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"